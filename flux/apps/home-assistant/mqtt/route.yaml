apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: mqtt
  namespace: home-assistant
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - home-mqtt.h3rmt.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mosquitto-service
          namespace: home-assistant
          port: 1883
