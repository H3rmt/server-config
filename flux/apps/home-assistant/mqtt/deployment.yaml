apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      # securityContext:
      #   runAsUser: 1883
      #   runAsGroup: 1883
      #   fsGroup: 1883
      #   fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        thread-usb: "1"
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine
          command:
            - /bin/sh
            - -ec
            - |
              id
              for path in /mosquitto/config /mosquitto/auth /mosquitto/certs /mosquitto/data; do
                printf '\n== %s ==\n' "$path"
                ls -lah "$path" || true
              done
              for file in /mosquitto/config/mosquitto.conf /mosquitto/config/acls /mosquitto/auth/pwfile /mosquitto/certs/tls.crt /mosquitto/certs/tls.key; do
                printf '\n== %s ==\n' "$file"
                ls -lah "$file" || true
                cat "$file" || true
              done
              exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
          ports:
            - containerPort: 8883
              protocol: TCP
              name: mqtt-secure
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: certs
              mountPath: /mosquitto/certs/
              readOnly: true
            - name: data
              mountPath: /mosquitto/data/
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
            defaultMode: 0440
        - name: auth
          secret:
            secretName: mosquitto-auth
            defaultMode: 0440
        - name: certs
          secret:
            secretName: mqtts-tls
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data-pvc
