listener 8883
protocol mqtt
# go-e only has tls 1.2
tls_version tlsv1.2
require_certificate false

listener 1883
protocol mqtt

cafile /etc/ssl/certs/ca-certificates.crt
keyfile /etc/mosquitto/certs/tls.key
certfile /etc/mosquitto/certs/tls.crt

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

global_plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /etc/mosquitto/pwfile

# Access Control List (ACL) configuration
global_plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /etc/mosquitto/acls
