apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: home-assistant
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout

    global_plugin /usr/lib/mosquitto_password_file.so
    plugin_opt_password_file /mosquitto/config/pwfile

    # Access Control List (ACL) configuration
    global_plugin /usr/lib/mosquitto_acl_file.so
    plugin_opt_acl_file /mosquitto/config/acls

    log_type subscribe
    log_type unsubscribe
    log_type rst

  acls: |
    # Allow home-assistant to do everything
    user home-assistant
    topic readwrite #

    # User go-eCharger can read and write to the go-eCharger topic
    user go-eCharger
    topic readwrite go-eCharger/#
    topic read homeassistant/#