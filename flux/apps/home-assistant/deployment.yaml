apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
      namespace: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
        namespace: home-assistant
    spec:
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.7
          ports:
            - name: hass
              containerPort: 8123
          env:
            - name: TZ
              value: "Europe/Berlin"
          volumeMounts:
            - name: config
              mountPath: /config
        - name: openthread-border-router
          image: ghcr.io/ownbee/hass-otbr-docker:7e60d50
          ports:
            - name: otbr-rest
              containerPort: 8080
            - name: otbr-web
              containerPort: 8081
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            supplementalGroups:
              - 27
          env:
            - name: DEVICE
              value: "/dev/ttyUSB0"
            - name: OTBR_REST_PORT
              value: "8080"
            - name: OTBR_WEB_PORT
              value: "8081"
            - name: OTBR_WEB
              value: "1"
            - name: THREAD_BETA
              value: "1"
            - name: BAUDRATE
              value: "460800"
          volumeMounts:
            - name: ttyusb0
              mountPath: /dev/ttyUSB0
          
      nodeSelector:
        thread-usb: "1"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: ttyusb0
          hostPath:
            path: /dev/ttyUSB0
            type: CharDevice
