apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app: home-assistant
    namespace: home-assistant
  ports:
    - name: hass
      port: 8001
      targetPort: 8123
    - name: otbr-web
      port: 8002
      targetPort: 8085
    - name: matter
      port: 8003
      targetPort: 5580
