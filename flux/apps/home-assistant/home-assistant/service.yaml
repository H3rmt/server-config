apiVersion: v1
kind: Service
metadata:
  name: home-assistant-svc
  namespace: home-assistant
spec:
  ports:
    - name: hass
      port: 8123
      targetPort: 8123

---

apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-es
  namespace: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant-svc
addressType: IPv4
ports:
  - name: http
    port: 8123
endpoints:
  - addresses:
      - 192.168.187.12