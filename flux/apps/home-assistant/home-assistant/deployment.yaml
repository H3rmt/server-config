apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "home-assistant-nad",
              "interface": "home1",
              "ips": ["192.168.187.13/24"],
              "gateway": ["192.168.187.1"]
            }
          ]
        home-assistant.h3rmt.dev/network-revision: "2"
    spec:
      nodeSelector:
        location: "home"
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          ports:
            - name: hass
              containerPort: 8123
              #  multicast discovery
            - containerPort: 9522
              hostPort: 9522
              protocol: UDP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: DBUS_SYSTEM_BUS_ADDRESS
              value: "unix:path=/run/dbus/system_bus_socket"
            - name: PG_URL # load from storage-app secret
              valueFrom:
                secretKeyRef:
                  name: storage-app
                  key: fqdn-uri
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
          securityContext:
            privileged: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config-longhorn
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
