apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{
            "name": "home-assistant-nad",
            "interface": "home1",
            "default-route": []
          }]'
    spec:
      nodeSelector:
        thread-usb: "1"
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.7
          ports:
            - name: hass
              containerPort: 8123
              #  multicast discovery
            - containerPort: 9522
              hostPort: 9522
              protocol: UDP
          env:
            - name: TZ
              value: "Europe/Berlin"
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config