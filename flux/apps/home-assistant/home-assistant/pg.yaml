apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: storage
  namespace: home-assistant
spec:
  instances: 2
  storage:
    storageClass: local-path
    size: 15Gi

---

apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: home-assistant-storage-database
  namespace: home-assistant
spec:
  cluster: 
    name: storage
  name: storage
  owner: home-assistant