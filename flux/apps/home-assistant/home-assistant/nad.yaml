apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: home-assistant-nad-macvlan
  namespace: home-assistant
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eth0", 
      "mode": "bridge",
      "ipam": {
        "type": "dhcp",
        "routes": [{ "dst": "192.168.187.0/24", "gw": "192.168.187.1" }],
        "provide": [{ "option": "host-name", "fromArg": "home-assistant" }],
        "subnet": "192.168.187.0/24"
      }
    }'