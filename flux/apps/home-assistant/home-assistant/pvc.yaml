apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config-longhorn-3
  namespace: home-assistant
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/long-retention: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-3
  resources:
    requests:
      storage: 2Gi
