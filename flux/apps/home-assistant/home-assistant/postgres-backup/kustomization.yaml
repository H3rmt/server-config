apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - secret.enc.yaml
  - object-store.yaml
  - scheduled-backup.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: storage
      namespace: home-assistant
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: postgres-backup
