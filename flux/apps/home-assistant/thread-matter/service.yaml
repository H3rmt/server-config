apiVersion: v1
kind: Service
metadata:
  name: thread-matter-svc
  namespace: home-assistant
spec:
  type: ClusterIP
  selector:
    app: thread-matter
  ports:
    - name: otbr-rest
      port: 8081
      targetPort: 8081
    - name: otbr-webui
      port: 8085
      targetPort: 8085
    - name: matter-webui
      port: 5580
      targetPort: 5580
