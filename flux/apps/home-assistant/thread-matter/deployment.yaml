apiVersion: apps/v1
kind: Deployment
metadata:
  name: thread-matter
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: thread-matter
  template:
    metadata:
      labels:
        app: thread-matter
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        thread-usb: "1"
        location: "home"
      containers:
        - name: openthread-border-router
          image: ghcr.io/ownbee/hass-otbr-docker:v0.5.0@sha256:2f927f06f803c5dd16f97f8aad752c53d92e2c3b1de90fe4273f278fc6cc8206
          securityContext:
            privileged: true
          volumeMounts:
            - name: otbr-data
              mountPath: /data
          env:
            - name: DEVICE
              value: "/dev/ttyUSB0"
            - name: BACKBONE_IF
              value: "eth0"
            - name: NAT64
              value: "1"
            - name: OTBR_WEB_PORT
              value: "8085"
            - name: OTBR_WEB
              value: "1"
            - name: THREAD_BETA
              value: "0"
            - name: AUTOFLASH_FIRMWARE
              value: "0"
            - name: FLOW_CONTROL
              value: "0"
            - name: BAUDRATE
              value: "460800"
            - name: OTBR_LOG_LEVEL
              value: "warning"
            - name: OTBR_REST_PORT
              value: "8081"
        - name: matter
          image: ghcr.io/matter-js/matterjs-server:1.6.0
          volumeMounts:
            - name: matter-data
              mountPath: /data
          env:
            - name: PRODUCTION_MODE
              value: "1"
            - name: PRIMARY_INTERFACE
              value: "eth0"
      volumes:
        - name: otbr-data
          persistentVolumeClaim:
            claimName: otbr-data-longhorn
        - name: matter-data
          persistentVolumeClaim:
            claimName: matter-data-longhorn
