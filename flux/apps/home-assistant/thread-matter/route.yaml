apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matter
  namespace: home-assistant
  annotations:
    external-dns.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - matter.home.h3rmt.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: thread-matter-svc
          namespace: home-assistant
          port: 5580

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thread
  namespace: home-assistant
