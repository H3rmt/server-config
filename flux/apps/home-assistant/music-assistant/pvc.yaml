apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-data-longhorn
  namespace: home-assistant
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/long-retention: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
