apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "music-assistant-nad",
              "interface": "home2",
              "ips": ["192.168.187.14/24"],
              "gateway": ["192.168.187.1"]
            }
          ]
    spec:
      nodeSelector:
        location: "home"
      containers:
        - name: music-assistant
          image: ghcr.io/music-assistant/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8095
              hostPort: 8095
              protocol: TCP
            - name: stream
              containerPort: 8097
              hostPort: 8097
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
        - name: ytdlp-pot-provider
          image: brainicism/bgutil-ytdlp-pot-provider:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 4416
              protocol: TCP
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data-longhorn