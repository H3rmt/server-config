apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: faster-whisper
  namespace: home-assistant
spec:
  replicas: 1
  serviceName: faster-whisper
  selector:
    matchLabels:
      app: faster-whisper
  template:
    metadata:
      labels:
        app: faster-whisper
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        gpu: nvidia
      containers:
        - name: faster-whisper
          image: lscr.io/linuxserver/faster-whisper:gpu-legacy
          ports:
            - name: faster-whisper
              containerPort: 10300
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: WHISPER_BEAM
              value: "1"
            - name: WHISPER_LANG
              value: de
            - name: WHISPER_MODEL
              value: small
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: faster-whisper-config
