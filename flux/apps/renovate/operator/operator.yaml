apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  ref:
    tag: 7.0.0
    digest: sha256:cb8f083de9eb9e64af50ffadf8a7c62a3f8f41014d465da7f38effe15fdc8ad3

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
