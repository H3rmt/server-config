apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-job
  namespace: renovate
spec:
  schedule: "0 * * * *" # Hourly
  secretRef: renovate-secret-config
  provider:
    name: github
  image: ghcr.io/renovatebot/renovate:latest@sha256:69e3c20b19f901ca7b02f609216d5ccf0fa700387001f099817852da3dfb617c
  parallelism: 3
  discoveryFilters: 
    # - "h3rmt/*"
    - "h3rmt/server-config"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: size
                operator: In
                values:
                  - large
  webhook:
    enabled: true
    authentication:
      enabled: true
      # secretRef:
      #   name: renovate-webhook-token
      #   key: token
    sync:
      enabled: true
  renovateConfig:
    configMapRef: 
      name: renovate-config
      key: config.json5
  scratchVolume:
    enabled: true
    sizeLimit: "5Gi"
      