apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret-config.enc.yaml
  - operator
  - job.yaml
generatorOptions:
  disableNameSuffixHash: false
configMapGenerator:
  - name: renovate-config
    namespace: renovate
    files:
      - config.yaml=config/config.yaml
