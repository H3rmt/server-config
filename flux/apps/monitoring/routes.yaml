apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: instance
  namespace: monitoring
  annotations:
    external-dns.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - vm.monitor.h3rmt.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vmsingle-main
          namespace: monitoring
          port: 8429

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent
  namespace: monitoring
  annotations:
    external-dns.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: traefik
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - ag.monitor.h3rmt.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vmagent-main
          namespace: monitoring
          port: 8429
