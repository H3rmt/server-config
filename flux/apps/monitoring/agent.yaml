apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: main
  namespace: monitoring
spec:
  selectAllByDefault: true
  scrapeInterval: 30s
  scrapeTimeout: 10s
  remoteWrite:
    - url: http://vmsingle-main.monitoring.svc.cluster.local:8428/api/v1/write
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  
