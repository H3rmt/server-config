apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: storage
  namespace: home-assistant
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: storage
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: storage
  namespace: pocket-id
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: storage
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
