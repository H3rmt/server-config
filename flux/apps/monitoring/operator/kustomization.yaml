apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: monitoring-operator-values
    namespace: monitoring
    files:
      - values.yaml=monitoring-operator-values.yaml
