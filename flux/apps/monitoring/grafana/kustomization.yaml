apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oidc.yaml
  - install.yaml
  - victora-metrics-plugin.yaml
  - dashboards
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: grafana-values
    namespace: monitoring
    files:
      - values.yaml=grafana-values.yaml
