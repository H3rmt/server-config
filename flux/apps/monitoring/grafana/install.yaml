apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    tag: 14.0.1
    digest: sha256:a624048a169beb3824adfd0a1d08a4f163e949cc75e07c9a32974acae1c58551

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
