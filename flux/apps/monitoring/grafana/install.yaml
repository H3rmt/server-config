apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    tag: 14.6.1
    digest: sha256:a1a3896c27b60a6305df55738be8dafb338cc71c92286c96d7423985c3248a6a

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
