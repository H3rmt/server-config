apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    tag: 14.5.0
    digest: sha256:ed4f62a8132a3cae18ef7db5ea1e727e08d2e1fdd87f24819dcf9d7b267f3b0c

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
