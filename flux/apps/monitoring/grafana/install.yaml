apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    tag: 14.4.1
    digest: sha256:ca3feec1043924488cbac6e6b0545bc148b3457c9edca110b303a917359d315f

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
