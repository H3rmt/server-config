apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref: 
    tag: 14.2.0
    digest: sha256:022c539b087a1b2d7cd95ffd6e34e7840309c6515791219a4236146498c2112b

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
