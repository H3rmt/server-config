# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana-community/helm-charts/refs/heads/main/charts/grafana/values.schema.json

replicas: 1

serviceMonitor:
  enabled: true

route:
  main:
    enabled: true
    parentRefs:
      - name: traefik
        namespace: kube-system
        kind: Gateway
        sectionName: websecure
    annotations:
      external-dns.kubernetes.io/ttl: "300"
    hostnames:
      - grafana.monitor.h3rmt.dev

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  resources:
    requests:
      storage: 100Gi
  storageClassName: longhorn

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
  datasources:
    enabled: true
    label: grafana_datasource
  notifiers:
    enabled: true
    label: grafana_notifier
  alerts:
    enabled: true
    label: grafana_alert
  plugins:
    enabled: true
    label: grafana_plugin

imageRenderer:
  enabled: true
  serviceMonitor:
    enabled: true

# dashboards:
#   kubernetes-dashboards:
#     victoriametrics-operator:
#       gnetId: 17869
#       datasource: Victoria-Metrics

grafana.ini:
  server:
    root_url: https://grafana.monitor.h3rmt.dev
  auth:
    disable_login_form: true
  auth.basic:
    enabled: true
  auth.generic_oauth:
    enabled: true
    use_pkce: true
    allow_sign_up: true
    auto_login: true
    name: Pocket Id
    scopes: "openid profile email groups"

    # All from secrets
    # client_id: -
    # client_secret: -
    # auth_url: -
    # api_url: -
    # token_url: -

    role_attribute_path: contains(groups[*], 'monitoring-admin-users') && 'Admin' || contains(groups[*], 'monitoring-edit-users') && 'Editor' || 'Viewer'
    allow_assign_grafana_admin: true
    role_attribute_strict: true

envFromSecret: grafana-oidc-credentials
podAnnotations:
  secret.reloader.stakater.com/reload: grafana-oidc-credentials