apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-vm
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  vm-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Victoria-Metrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://vmsingle-main.monitoring.svc.cluster.local:8428
        isDefault: true
        editable: false