apiVersion: operator.victoriametrics.com/v1
kind: VMSingle
metadata:
  name: main
  namespace: monitoring
spec:
  retentionPeriod: 1y
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 100Gi
    storageClassName: longhorn
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi