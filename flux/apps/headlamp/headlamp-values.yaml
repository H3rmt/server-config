# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/headlamp/refs/heads/main/charts/headlamp/values.schema.json

replicaCount: 1
config:
  inCluster: true
  enableHelm: true
  extraArgs:
    - "-oidc-use-pkce=true"
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc-credentials
      key: client_secret
      hasScopes: true
  unsafeUseServiceAccountToken: true
httpRoute:
  enabled: true
  annotations:
    external-dns.kubernetes.io/ttl: "300"
  parentRefs:
    - name: traefik
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - headlamp.h3rmt.dev
