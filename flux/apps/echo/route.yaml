apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-echo
  namespace: echo
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - kind: Gateway
      sectionName: https
      name: traefik
      namespace: kube-system
  hostnames:
    - echo.h3rmt.dev
    - test.h3rmt.dev
    - echo-test.h3rmt.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: http-echo
          namespace: echo
          port: 8080
