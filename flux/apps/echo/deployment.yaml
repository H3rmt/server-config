apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: echo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-echo
      namespace: echo
  template:
    metadata:
      labels:
        app: http-echo
        namespace: echo
    spec:
      containers:
        - name: http-echo
          image: mendhak/http-https-echo:latest@sha256:c4a81744e620ad3cfbffa97374c9c0e545bb3d132b07ebc7745cce6ddee745a1
          ports:
            - containerPort: 8080
