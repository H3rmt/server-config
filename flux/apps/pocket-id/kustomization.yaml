apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - operator.yaml
  - pg.yaml
  - secret.enc.yaml
  - instance.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: pocket-id-operator-values
    namespace: pocket-id
    files:
      - values.yaml=pocket-id-operator-values.yaml
