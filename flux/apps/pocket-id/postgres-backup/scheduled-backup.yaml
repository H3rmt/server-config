apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: storage-daily
  namespace: pocket-id
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: storage
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
