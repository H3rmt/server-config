apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-setup
  namespace: flux-system
spec:
  interval: 2m
  path: ./infrastructure/cert-manager/setup
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 2m
  path: ./infrastructure/cert-manager/issuers
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: cert-manager-setup
  sourceRef:
    kind: GitRepository
    name: flux-system