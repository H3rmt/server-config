apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    semver: "41.0.2"

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  values:
    api:
      dashboard: true
    
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
         - web

    # Privacy-friendly Prometheus metrics (cluster-internal only)
    metrics:
      prometheus:
        enabled: true
        addEntryPointsLabels: true
        addServicesLabels: true
        addRoutersLabels: true
        service:
          enabled: true
      addInternals: false
      replicas: 3

    providers:
      kubernetesGateway:
        enabled: true
    
    # ports:
    #   metrics:
    #     expose:
    #       default: false
    #   web:
    #     port: 80
    #     redirections:
    #       entryPoint:
    #         to: websecure
    #   websecure:
    #     port: 443