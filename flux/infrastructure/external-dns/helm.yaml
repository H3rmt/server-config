apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 12h
  url: https://kubernetes-sigs.github.io/external-dns/

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: kube-system
spec:
  interval: 2m
  chart:
    spec:
      chart: external-dns
      version: '1.21.1'
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  values:
    logLevel: debug
    policy: sync
    registry: txt
    txtOwnerId: k3s-cluster
    txtPrefix: reg-%{record_type}-
    domainFilters: 
      - h3rmt.dev
    sources:
      - node
      - gateway-httproute
    managedRecordTypes: 
      - A
      - AAAA
    interval: 1m
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/mconfalonieri/external-dns-hetzner-webhook
          tag: v1.0.0
        env:
          - name: HETZNER_API_KEY
            valueFrom:
              secretKeyRef:
                name: hetzner-dns-credentials-external-dns
                namespace: kube-system
                key: token
          - name: USE_CLOUD_API
            value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    
    serviceMonitor:
      # disable if deployed before prometheus
      enabled: false