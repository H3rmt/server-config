apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 12h
  url: https://ot-container-kit.github.io/helm-charts/

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: operators
spec:
  interval: 2m
  chart:
    spec:
      chart: redis-operator
      version: 0.26.1
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: flux-system
      interval: 1h