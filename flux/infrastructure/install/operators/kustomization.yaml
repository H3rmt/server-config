apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pg.yaml
  - barman-cloud.yaml
  - redis.yaml
  - reloader.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: postgres-operator-values
    namespace: operators
    files:
      - values.yaml=postgres-operator-values.yaml
  - name: reloader-values
    namespace: operators
    files:
      - values.yaml=reloader-values.yaml
