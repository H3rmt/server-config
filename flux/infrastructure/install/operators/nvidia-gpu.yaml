apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia-gpu-operator
  namespace: flux-system
spec:
  interval: 12h
  url: oci://nvcr.io/nvidia/cloud-native-charts/gpu-operator

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
  namespace: operators
spec:
  interval: 2m
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.0
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: flux-system
      interval: 1h