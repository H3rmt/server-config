apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-short
  namespace: longhorn-system
spec:
  name: backup-short
  task: backup
  cron: "0 */2 * * *"
  retentionPolicy: age-based
  retainAge: 48h  # 2 days
  concurrency: 1
  groups:
    - short-retention
  labels:
    retention: short
  parameters:
    full-backup-interval: "22"  # 12 per day so every ~1.8 days

---

apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-long
  namespace: longhorn-system
spec:
  name: backup-long
  task: backup
  cron: "0 */4 * * *"
  retentionPolicy: age-based
  retainAge: 720h  # 30 days
  concurrency: 1
  groups:
    - long-retention
  labels:
    retention: long
  parameters:
    full-backup-interval: "120"  # 6 per day so every 20 days
