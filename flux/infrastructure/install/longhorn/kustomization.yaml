apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.enc.yaml
  - deployment.yaml
  - longhorn-storageclass.yaml
  - longhorn-recurring-backups.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: longhorn-values
    namespace: longhorn-system
    files:
      - values.yaml=longhorn-values.yaml
