apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 12h
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.21.3
    digest: sha256:e482675aec32862d323a9218293ff7de81192337998615e4378c56498473f240
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-values

---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-hetzner
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.hetzner.cloud

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-hetzner
  namespace: cert-manager
spec:
  interval: 2m
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: 0.8.0
      sourceRef:
        kind: HelmRepository
        name: cert-manager-hetzner
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-hetzner-values
