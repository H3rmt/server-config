# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json

global:
  checkNewVersion: true
  sendAnonymousUsage: true

deployment:
  kind: DaemonSet
  minReadySeconds: 2

service:
  spec:
    ipFamilyPolicy: RequireDualStack

api:
  dashboard: true
ingressRoute:
  dashboard:
    enabled: true

updateStrategy:
  type: RollingUpdate
  # rollingUpdate:
  #   maxUnavailable: 1
ingressClass:
  enabled: false

gateway:
  name: traefik
  # defaultScope: "All"
  listeners:
    web:
      port: 8000
      hostname: "*.h3rmt.dev"
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      hostname: "*.h3rmt.dev"
      protocol: HTTPS
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - namespace: kube-system
          name: wildcard-h3rmt-dev-tls
    secure-mqtt:
      port: 8883
      protocol: TCP
      namespacePolicy:
        from: All
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    # music-assistant:
    #   port: 8097
    #   protocol: TCP
    #   namespacePolicy:
    #     from: home-assistant
    #   allowedRoutes:
    #     kinds:
    #       - kind: TCPRoute

metrics:
  prometheus:
    enabled: true
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
  addInternals: false

providers:
  kubernetesGateway:
    enabled: true
    experimentalChannel: true
  kubernetesIngress:
    enabled: false

ports:
  web:
    port: 8000
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    observability:
      accessLogs: false
      metrics: false
      tracing: false
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    asDefault: true
    http3:
      enabled: true
      advertisedPort: 443
  secure-mqtt:
    port: 8883
    exposedPort: 8883
    expose:
      default: true
    observability:
      accessLogs: false
      metrics: false
      tracing: false
  # music-assistant:
  #   port: 8097
  #   exposedPort: 8097
  #   expose:
  #     default: true
  #   observability:
  #     accessLogs: false
  #     metrics: false
  #     tracing: false
