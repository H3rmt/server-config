apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    tag: 42.3.1
    digest: sha256:a702a4316735397ecd1c3ed5287cccf87cdbc69abb0451c0b2d371408473bc33

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
