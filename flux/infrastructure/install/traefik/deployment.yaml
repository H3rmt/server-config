apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    tag: 42.2.0
    digest: sha256:65e1a6dbcd5e346167b3d9c470ba8b444f1a2462c31d6e8e21290f68fd83963a

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
