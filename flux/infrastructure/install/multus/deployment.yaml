apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: multus-rancher
  namespace: flux-system
spec:
  interval: 12h
  url: https://rke2-charts.rancher.io

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus-rancher
  namespace: kube-system
spec:
  interval: 2m
  chart:
    spec:
      chart: rke2-multus
      version: v4.3.0
      sourceRef:
        kind: HelmRepository
        name: multus-rancher
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: multus-values
