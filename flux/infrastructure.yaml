apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  # uses webhooks to trigger reconciliation on changes
  interval: 1m
  url: "https://github.com/h3rmt/server-config.git"
  ref:
    branch: next

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 2m
  path: ./flux/infrastructure/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      # gets manually created once
      name: sops-age