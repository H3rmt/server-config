all:
  vars:
    ansible_user: root
    # ansible_become: true
  hosts:
    192.168.187.15:
      raspi_metrics_bind_address: 192.168.187.15

      raspi_bt_proxy_enabled: true
      raspi_bt_proxy_repo_url: https://github.com/denvera/bt-proxy.git
      raspi_bt_proxy_repo_dir: /opt/bt-proxy
      raspi_bt_proxy_version: HEAD
      # Confirm the USB adapter's hciX name with `ls /sys/class/bluetooth`.
      raspi_bt_proxy_adapter: hci0
      raspi_bt_proxy_bind_address: 192.168.187.15
      raspi_bt_proxy_name: raspi-bt-proxy
      raspi_bt_proxy_port: 6053
      raspi_bt_proxy_service: bt-proxy

      raspi_otbr_enabled: true
      # Native OpenThread Border Router build settings. Confirm the radio URL
      # and infrastructure interface before enabling an OTBR deployment.
      # https://openthread.io/guides/border-router/build-native
      raspi_otbr_repo_url: https://github.com/openthread/ot-br-posix.git
      raspi_otbr_repo_dir: /opt/otbr
      raspi_otbr_repo_version: HEAD
      raspi_otbr_infra_if_name: eth0
      raspi_otbr_thread_if_name: wpan0
      raspi_otbr_radio_url: "spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=115200&uart-init-deassert"
      raspi_otbr_txpower_dbm: 10
      raspi_otbr_agent_opts: "-I {{ raspi_otbr_thread_if_name }} -B {{ raspi_otbr_infra_if_name }} --rest-listen-address :: --rest-listen-port 8081 -d5 -v {{ raspi_otbr_radio_url }} trel://{{ raspi_otbr_infra_if_name }}"
      raspi_otbr_web_opts: "-I {{ raspi_otbr_thread_if_name }} -p 8080 -a 192.168.187.15"
    192.168.187.16:
      receiver_metrics_bind_address: 192.168.187.16
      receiver_metrics_port: 9101
      receiver_renderer_stale_after_seconds: 900
      receiver_disk_interval_minutes: 5
      receiver_renderer_interval_seconds: 60
