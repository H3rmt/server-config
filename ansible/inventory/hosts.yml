all:
  vars:
    ansible_user: user
    ansible_become: true
  hosts:
    192.168.187.15:
      raspi_metrics_bind_address: 192.168.187.15
      raspi_otbr_enabled: false
      # Native OpenThread Border Router build settings. Confirm the radio URL
      # and infrastructure interface before enabling an OTBR deployment.
      raspi_otbr_repo_url: https://github.com/openthread/ot-br-posix.git
      raspi_otbr_repo_dir: /opt/otbr
      raspi_otbr_infra_if_name: wlan0
      raspi_otbr_thread_if_name: wpan0
      raspi_otbr_radio_url: spinel+hdlc+uart:///dev/ttyACM0
      raspi_otbr_agent_opts: "-I {{ raspi_otbr_thread_if_name }} -B {{ raspi_otbr_infra_if_name }} {{ raspi_otbr_radio_url }}"
      raspi_otbr_agent_service: otbr-agent
      raspi_otbr_agent_defaults: /etc/default/otbr-agent
    192.168.187.16:
      receiver_metrics_bind_address: 192.168.187.16
      receiver_metrics_port: 9101
      receiver_renderer_stale_after_seconds: 900
      receiver_disk_interval_minutes: 5
      receiver_renderer_interval_seconds: 60
