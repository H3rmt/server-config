# Merge these sections into the existing Prometheus configuration/rules.
# Addresses are intentionally placeholders: use LAN DNS/IPs only.
scrape_configs:
  - job_name: home-devices
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.187.15:9100"]
        labels:
          device: otbr-pi
          location: home
          role: thread-border-router
      - targets: ["192.168.187.16:9101"]
        labels:
          device: receiver
          location: home
          role: receiver
