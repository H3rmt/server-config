#!/usr/bin/env -S ansible-playbook -i ./inventory/hosts.yml --diff
# lets this run as a standalone file
- name: Install the lightweight Pi exporter and otbr
  hosts: 192.168.187.15
  roles:
    - pi-node-exporter

- name: Install the receiver and renderer health exporter
  hosts: 192.168.187.16
  gather_facts: false
  pre_tasks:
    - name: Install Python through opkg when it is missing
      ansible.builtin.raw: >-
        command -v python3 >/dev/null 2>&1 ||
        opkg install python3
      become: true

    - name: Gather receiver facts after Python bootstrap
      ansible.builtin.setup:
  roles:
    - receiver-exporter
