---
- name: Restart node exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart OTBR agent
  ansible.builtin.service:
    name: "{{ raspi_otbr_agent_service }}"
    state: restarted

- name: Restart Bluetooth proxy
  ansible.builtin.systemd_service:
    name: "{{ raspi_bt_proxy_service }}"
    daemon_reload: true
    state: restarted
