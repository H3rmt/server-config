---
- name: Restart node exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart OTBR agent
  ansible.builtin.systemd_service:
    name: otbr-agent
    state: restarted
    daemon_reload: true

- name: Restart Bluetooth proxy
  ansible.builtin.systemd_service:
    name: bt-proxy
    state: restarted
    daemon_reload: true
