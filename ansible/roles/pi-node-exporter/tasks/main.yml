---
- name: Install the distribution node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true

- name: Configure node exporter to listen on the LAN interface
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by server-config/ansible.
      ARGS="--web.listen-address={{ raspi_metrics_bind_address }}:9100"
  notify: Restart node exporter

- name: Enable node exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Install Git for native OTBR
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  when: raspi_otbr_enabled | bool

- name: Clone OTBR source repository
  ansible.builtin.git:
    repo: "{{ raspi_otbr_repo_url }}"
    dest: "{{ raspi_otbr_repo_dir }}"
    depth: 1
    recursive: true
    version: "{{ raspi_otbr_repo_version }}"
    update: true
  when: raspi_otbr_enabled | bool

- name: Bootstrap native OTBR dependencies and build
  ansible.builtin.command:
    cmd: ./script/bootstrap
    chdir: "{{ raspi_otbr_repo_dir }}"
    creates: "{{ raspi_otbr_repo_dir }}/.ansible-bootstrap-complete"
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: raspi_otbr_enabled | bool

- name: Mark native OTBR bootstrap complete
  ansible.builtin.file:
    path: "{{ raspi_otbr_repo_dir }}/.ansible-bootstrap-complete"
    state: touch
    owner: root
    group: root
    mode: '0644'
    access_time: preserve
    modification_time: preserve
  when: raspi_otbr_enabled | bool

- name: Run native OTBR setup
  ansible.builtin.command:
    cmd: ./script/setup
    chdir: "{{ raspi_otbr_repo_dir }}"
    creates: "{{ raspi_otbr_repo_dir }}/.ansible-setup-complete"
  environment:
    INFRA_IF_NAME: "{{ raspi_otbr_infra_if_name }}"
  when: raspi_otbr_enabled | bool

- name: Mark native OTBR setup complete
  ansible.builtin.file:
    path: "{{ raspi_otbr_repo_dir }}/.ansible-setup-complete"
    state: touch
    owner: root
    group: root
    mode: '0644'
    access_time: preserve
    modification_time: preserve
  when: raspi_otbr_enabled | bool

- name: Configure OTBR radio and interface options
  ansible.builtin.lineinfile:
    path: /etc/default/otbr-agent
    regexp: '^OTBR_AGENT_OPTS='
    line: 'OTBR_AGENT_OPTS="{{ raspi_otbr_agent_opts }}"'
    create: false
  notify: Restart OTBR agent
  when: raspi_otbr_enabled | bool

- name: Configure OTBR web
  ansible.builtin.lineinfile:
    path: /etc/default/otbr-web
    regexp: '^OTBR_WEB_OPTS='
    line: 'OTBR_WEB_OPTS="{{ raspi_otbr_web_opts }}"'
    create: false
  notify: Restart OTBR agent
  when: raspi_otbr_enabled | bool

- name: Ensure OTBR agent drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/otbr-agent.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: raspi_otbr_enabled | bool
  tags:
    - otbr_txpower

- name: Install OTBR TX power readiness helper
  ansible.builtin.copy:
    src: otbr-set-txpower
    dest: /usr/local/sbin/otbr-set-txpower
    owner: root
    group: root
    mode: '0755'
  notify: Restart OTBR agent
  when: raspi_otbr_enabled | bool
  tags:
    - otbr_txpower

- name: Configure persistent OTBR TX power
  ansible.builtin.copy:
    dest: /etc/systemd/system/otbr-agent.service.d/txpower.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Apply the configured RCP TX power after every otbr-agent start.
      # Managed by server-config/ansible (roles/pi-node-exporter).
      [Service]
      ExecStartPost=/usr/local/sbin/otbr-set-txpower {{ raspi_otbr_txpower_dbm }}
  notify: Restart OTBR agent
  when: raspi_otbr_enabled | bool
  tags:
    - otbr_txpower

- name: Enable and start OTBR agent
  ansible.builtin.service:
    name: otbr-agent
    enabled: true
    state: started
  when: raspi_otbr_enabled | bool

- name: Enable and start OTBR web
  ansible.builtin.service:
    name: otbr-web
    enabled: true
    state: started
  when: raspi_otbr_enabled | bool

- name: Install Bluetooth proxy prerequisites
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-venv
      - bluez
      - dbus
    state: present
    update_cache: true
  when: raspi_bt_proxy_enabled | bool

- name: Ensure Bluetooth service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/bluetooth.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: raspi_bt_proxy_enabled | bool

- name: Enable BlueZ experimental D-Bus features for passive scanning
  ansible.builtin.copy:
    dest: /etc/systemd/system/bluetooth.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by server-config/ansible.
      [Service]
      ExecStart=
      ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental
  notify: Restart Bluetooth service
  when: raspi_bt_proxy_enabled | bool

- name: Enable Bluetooth service for the proxy
  ansible.builtin.service:
    name: bluetooth
    enabled: true
    state: started
  when: raspi_bt_proxy_enabled | bool

- name: Clone bt-proxy source repository
  ansible.builtin.git:
    repo: "{{ raspi_bt_proxy_repo_url }}"
    dest: "{{ raspi_bt_proxy_repo_dir }}"
    depth: 1
    version: "{{ raspi_bt_proxy_version }}"
    update: true
  notify: Restart Bluetooth proxy
  when: raspi_bt_proxy_enabled | bool

- name: Create bt-proxy Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv .venv
    chdir: "{{ raspi_bt_proxy_repo_dir }}"
    creates: "{{ raspi_bt_proxy_repo_dir }}/.venv/bin/python"
  when: raspi_bt_proxy_enabled | bool

- name: Install bt-proxy and its Python dependencies
  ansible.builtin.pip:
    name: "{{ raspi_bt_proxy_repo_dir }}"
    executable: "{{ raspi_bt_proxy_repo_dir }}/.venv/bin/pip"
    editable: true
    state: present
  notify: Restart Bluetooth proxy
  when: raspi_bt_proxy_enabled | bool

- name: Install bt-proxy systemd service
  ansible.builtin.template:
    src: bt-proxy.service.j2
    dest: "/etc/systemd/system/bt-proxy.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Bluetooth proxy
  when: raspi_bt_proxy_enabled | bool

- name: Enable and start bt-proxy
  ansible.builtin.systemd_service:
    name: "bt-proxy"
    daemon_reload: true
    enabled: true
    state: started
  when: raspi_bt_proxy_enabled | bool
