apiVersion: v1
kind: Namespace
metadata:
  name: authelia

---

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: coder-install
  namespace: kube-system
spec:
  repo: https://charts.authelia.com
  chart: authelia
  version: 0.10.50
  targetNamespace: authelia
  valuesContent: |-
  

---

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-cluster
  namespace: coder
spec:
  instances: 2
  storage:
    storageClass: local-path
    size: 3Gi

