apiVersion: v1
kind: Namespace
metadata:
  name: authelia

---

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: coder-install
  namespace: kube-system
spec:
  repo: https://charts.authelia.com
  chart: authelia
  version: 0.10.50
  targetNamespace: authelia
  valuesContent: |-

--- 

apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name:  redis-replication
  namespace: coder
spec:
  clusterSize: 3
  sentinel:
    size: 3
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Mi