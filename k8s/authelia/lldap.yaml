apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ldap-install
  namespace: kube-system
spec:
  repo: https://evantage-ws.github.io/lldap-kubernetes/
  chart: lldap
  version: 0.4.0
  targetNamespace: authelia
  valuesContent: |-
    fullnameOverride: lldap
    env:
      TZ: "Europe/Berlin"
    persistence:
      storageClassName: mayastor-3
    service:
      name: lldap
      type: ClusterIP
    hpa:
      enabled: false
    ingress:
      enabled: false
    certmanager:
      enabled: false
    secret:
      create: false
      name: lldap

--- 

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-lldap-ui
  namespace: authelia
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: websecure
      kind: Gateway
  hostnames:
    - lldap.h3rmt.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lldap
          port: 17170
