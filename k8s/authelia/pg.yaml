apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-storage
  namespace: authelia
spec:
  instances: 3
  storage:
    storageClass: local-path
    size: 3Gi
  managed:
    roles: 
      - name: authelia
        passwordSecret:
          name: authelia-storage-app
          key: password

---

apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authelia-storage-database
  namespace: authelia
spec:
  cluster: 
    name: authelia-storage
  name: authelia
  owner: authelia