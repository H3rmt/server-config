apiVersion: "openebs.io/v1alpha1"
kind: DiskPool
metadata:
  name: filepool-ovh-1
  namespace: openebs
spec:
  node: ovh-1
  # 2 TB disk image created with `truncate -s 2T /mnt/openebs.img`
  disks: ["aio:///mnt/openebs.img?blk_size=4096"]

---

apiVersion: "openebs.io/v1alpha1"
kind: DiskPool
metadata:
  name: filepool-hetzner-1
  namespace: openebs
spec:
  node: hetzner-1
  # 30GB disk image created with `truncate -s 30G /mnt/openebs.img`
  disks: ["aio:///mnt/openebs.img?blk_size=4096"]

---

apiVersion: "openebs.io/v1alpha1"
kind: DiskPool
metadata:
  name: filepool-home-2
  namespace: openebs
spec:
  node: home-2
  # 2T zfs block device created with `zfs create -V 2T tank/mayastor`
  disks: ["aio:///dev/zvol/tank/mayastor"]