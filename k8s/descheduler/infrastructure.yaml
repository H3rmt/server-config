apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: descheduler-install
  namespace: kube-system
spec:
  repo: https://kubernetes-sigs.github.io/descheduler/
  chart: descheduler
  version: v0.35.1
  targetNamespace: kube-system
  valuesContent: |-
    schedule: "*/5 * * * *"
    initContainers:
      - name: wait-for-network
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting 3 seconds for pod networking to initialize..."
            sleep 3
            echo "Network initialization wait complete"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
    deschedulerPolicy:
      strategies:
        RemoveDuplicates:
          enabled: true
        LowNodeUtilization:
          enabled: true
          params:
            thresholds:
              cpu: 20
            targetThresholds:
              cpu: 50