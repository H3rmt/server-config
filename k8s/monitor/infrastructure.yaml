apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetNamespace: monitor
  valuesContent: |-
    namespaceOverride: monitor
    alertmanager:
      enabled: true
      route:
        main:
          enabled: true
          hostnames:
            - alerts.infra.h3rmt.dev
          parentRefs:
            - name: traefik-gateway
              namespace: default
              sectionName: websecure
              kind: Gateway
          annotations:
            external-dns.alpha.kubernetes.io/ttl: "300"
    grafana:
      enabled: true
      defaultDashboardsTimezone: "Europe/Berlin"
      operator:
        dashboardsConfigMapRefEnabled: true
        matchLabels: 
          dashboards: "grafana"
    nodeExporter:
      enabled: false
    prometheusOperator:
      enabled: true
    prometheus:
      enabled: false
